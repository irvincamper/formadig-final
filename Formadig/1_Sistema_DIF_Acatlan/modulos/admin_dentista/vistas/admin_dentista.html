<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dentista - FORMADIG</title>
    <link rel="stylesheet" href="../../../css/main.css?v=99">
    <link rel="stylesheet" href="../../../css/modules.css?v=99">
    <link rel="stylesheet" href="../../../css/dashboard.css?v=99">
    <link rel="stylesheet" href="../../../css/clinical.css">
    <link rel="stylesheet" href="../diseno/admin_dentista.css">
    <script defer src="../../../core/formadig-core.js?v=276"></script>
    <script defer src="../../../core/clinical-ui.js"></script>
    <script defer src="../logica/admin_dentista.js"></script>
</head>
<body>
    <header class="header"></header><aside class="sidebar" id="sidebarMenu"></aside>
    <main class="workspace"><div class="workspace-content">
    <h1>Dentista</h1>
    <a href="../../../dashboard.html" class="button button--secondary">← Volver al Panel</a>
    <p>Consulta y seguimiento de atenciones. Registro disponible sólo en el ensayo sintético local; edición sujeta a autorización.</p>
    <p id="status" role="status" aria-live="polite">Verificando sesión…</p>
    <div class="clinical-grid">
    <section aria-labelledby="search-title" class="clinical-list">
        <h2 id="search-title">Expedientes de atención</h2>
        <form id="search-form">
            <label>Búsqueda<input name="q" maxlength="120" placeholder="Motivo, diagnóstico o tratamiento"></label>
            <label>UUID del paciente<input name="paciente_id" placeholder="00000000-0000-0000-0000-000000000001"></label>
            <label>Desde (ISO 8601 UTC)<input name="desde" placeholder="2026-10-01T00:00:00Z"></label>
            <label>Hasta (ISO 8601 UTC)<input name="hasta" placeholder="2026-10-31T23:59:59Z"></label>
            <button type="submit" class="button button--primary">Buscar</button><button type="button" id="history" class="button button--secondary">Consultar historial</button>
        </form>
        <div class="table-scroll"><table><thead><tr><th>Paciente</th><th>Fecha UTC</th><th>Motivo</th><th>Acción</th></tr></thead><tbody id="results"></tbody></table></div>
        <button id="previous" type="button" disabled>Anterior</button><button id="next" type="button" disabled>Siguiente</button>
    </section>
    <section aria-labelledby="form-title" class="clinical-detail">
        <h2 id="form-title">Seguimiento de atención dental</h2>
        <button type="button" id="new-attention" class="button button--secondary" disabled>Registro sintético local</button>
        <form id="attention-form">
            <label>UUID del paciente<input name="paciente_id" required></label>
            <label>Motivo de consulta<textarea name="motivo_consulta" maxlength="10000" required></textarea></label>
            <label>Diagnóstico<textarea name="diagnostico" maxlength="10000"></textarea></label>
            <label>Tratamiento realizado<textarea name="tratamiento_realizado" maxlength="10000"></textarea></label>
            <label>Costo de recuperación<input name="costo_recuperacion" type="number" min="0" max="99999999.99" step="0.01" value="0.00" required></label>
            <label>Fecha de atención (local)<input name="fecha_atencion" type="datetime-local"></label>
            <button type="submit" class="button button--primary" disabled>Selecciona una atención para seguimiento</button>
        </form>
        <h3>Detalle</h3><pre id="detail">Selecciona una atención.</pre>
    </section>
    </div></div></main>
</body>
</html>
